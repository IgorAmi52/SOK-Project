[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-visualizer"
version = "0.1.0"
description = "Simple visualizer plugin: D3.js force-directed circle-and-line graph rendering"
requires-python = ">=3.11"
authors = [
    { name = "Igor Amidžić" },
    { name = "Nikola Stevanović" },
    { name = "Miloš Jovanović" },
    { name = "Miloš Damjanović" },
    { name = "Zoran Repić" },
]
dependencies = [
    "graph-api",
    "jinja2>=3.0"
]

[project.entry-points."graph_platform.visualizer_plugins"]
simple = "simple_visualizer.plugin:SimpleVisualizerPlugin"

[tool.setuptools]
packages = ["simple_visualizer"]

[tool.setuptools.package-dir]
simple_visualizer = "."

[tool.setuptools.package-data]
simple_visualizer = ["templates/*.html"]
