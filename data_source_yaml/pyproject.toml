[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-source-yaml"
version = "0.1.0"
description = "YAML data source plugin for graph visualization platform"
requires-python = ">=3.11"
dependencies = [
    "graph-api",
    "PyYAML",
]

[project.entry-points."graph_platform.data_source_plugins"]
yaml = "yaml_data_source.plugin:YamlDataSourcePlugin"

[tool.setuptools]
packages = ["yaml_data_source"]
