[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-source-yaml"
version = "0.1.0"
description = "YAML data-source plugin: parses YAML documents into graph structures with cyclic-reference support"
requires-python = ">=3.11"
authors = [
    { name = "Igor Amidžić" },
    { name = "Nikola Stevanović" },
    { name = "Miloš Jovanović" },
    { name = "Miloš Damjanović" },
    { name = "Zoran Repić" },
]
dependencies = [
    "graph-api",
    "PyYAML",
]

[project.entry-points."graph_platform.data_source_plugins"]
yaml = "yaml_data_source.plugin:YamlDataSourcePlugin"

[tool.setuptools]
packages = ["yaml_data_source"]
