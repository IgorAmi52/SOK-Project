[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "block-visualizer"
version = "0.1.0"
description = "Block visualizer plugin for graph visualization platform"
requires-python = ">=3.11"
dependencies = [
    "graph-api",
    "jinja2>=3.0"
]

[project.entry-points."graph_platform.visualizer_plugins"]
block = "block_visualizer.plugin:BlockVisualizerPlugin"

[tool.setuptools]
packages = ["block_visualizer"]

[tool.setuptools.package-dir]
block_visualizer = "."

[tool.setuptools.package-data]
block_visualizer = ["templates/*.html"]
