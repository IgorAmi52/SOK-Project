[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-source-plugin-json"
version = "0.1.0"
description = "JSON data-source plugin: parses nested JSON into graph structures with cyclic-reference support"
requires-python = ">=3.11"
authors = [
    { name = "Igor Amidžić" },
    { name = "Nikola Stevanović" },
    { name = "Miloš Jovanović" },
    { name = "Miloš Damjanović" },
    { name = "Zoran Repić" },
]
dependencies = [
    "graph-api"
]

[project.entry-points."graph_platform.data_source_plugins"]
json = "data_source_plugin_json.plugin:JsonDataSourcePlugin"

[tool.setuptools]
packages = ["data_source_plugin_json"]

[tool.setuptools.package-dir]
data_source_plugin_json = "."
